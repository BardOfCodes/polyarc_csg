[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyarc_csg"
version = "0.1.0"
description = "CSG operations on PolySets (collections of PolyArcs)"
authors = [
    { name = "Aditya Ganeshan", email = "adityaganeshan@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "networkx",
    "numpy",
    "torch",
    "geolipi",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyarc_csg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

